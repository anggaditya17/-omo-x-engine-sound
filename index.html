<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>OMO X Engine Sound V3</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#080808;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}
main{max-width:520px;margin:auto;padding:22px}
h1{font-size:34px;margin:0}.sub{color:#888;letter-spacing:2px;font-size:11px}
.rpm{text-align:center;margin:28px 0}.rpmn{font-size:64px;font-weight:800;font-variant-numeric:tabular-nums}
.card{background:#191919;border-radius:18px;padding:18px;margin:14px 0}
.row{display:flex;justify-content:space-between;align-items:center}.muted{color:#999;font-size:12px}
input[type=range]{width:100%;accent-color:#ff8a00;margin:22px 0 10px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
button{border:0;border-radius:12px;padding:14px;font-weight:800;color:#fff;background:#303030}
.mode.active{background:#ff8a00}.start{width:100%;background:#19a65a;font-size:16px}.start.stop{background:#d93636}
.test{width:100%;margin-top:9px;background:#275c9b}
.status{padding:12px;border-radius:12px;background:#111;color:#aaa;font-size:12px;margin-top:12px}
.badge{color:#6ee7a0}.warn{color:#ffd166}
</style>
</head>
<body>
<main>
<h1>OMO X</h1><div class="sub">ENGINE SOUND V3</div>

<div class="rpm"><div class="rpmn" id="rpm">900</div><div class="muted">VIRTUAL RPM</div></div>

<div class="card">
<div class="row"><b>THROTTLE</b><b id="pct">0%</b></div>
<input id="gas" type="range" min="0" max="100" value="0">
<div class="row muted"><span>0</span><span>50</span><span>100</span></div>
</div>

<div class="card">
<b>SOUND CHARACTER</b>
<div class="modes">
<button class="mode active" data-mode="inline4">INLINE-4</button>
<button class="mode" data-mode="vtwin">V-TWIN</button>
<button class="mode" data-mode="electric">E-SPORT</button>
</div>
</div>

<button class="start" id="start">▶ START ENGINE</button>
<button class="test" id="test">🔊 TEST SPEAKER</button>

<div class="status" id="status">Audio belum aktif. Hubungkan OMO X Bluetooth, lalu tekan START ENGINE.</div>

<div class="card">
<div class="row"><b>LOCAL SAMPLES</b><span class="muted">V3</span></div>
<p class="muted">Inline-4: motorcycle sample<br>V-Twin: Harley sample<br>Electric: DC motor sample</p>
</div>
</main>

<script>
let ctx=null, master=null, running=false, mode="inline4", startTime=0, raf=0;
const gas=document.getElementById("gas"), rpmEl=document.getElementById("rpm"), pct=document.getElementById("pct");
const statusEl=document.getElementById("status");
const samples={
 inline4:{url:"audio/inline4.wav", min:0.55, max:1.85, base:900, red:12500},
 vtwin:{url:"audio/vtwin.ogg", min:0.65, max:1.65, base:750, red:7500},
 electric:{url:"audio/electric.wav", min:0.45, max:2.20, base:0, red:15000}
};
const buffers={};

async function init(){
 if(ctx) return;
 ctx=new (window.AudioContext||window.webkitAudioContext)();
 await ctx.resume();
 master=ctx.createGain(); master.gain.value=0.82; master.connect(ctx.destination);
 statusEl.innerHTML='<span class="badge">Audio aktif</span> • '+ctx.state;
}

async function loadSample(m){
 if(buffers[m]) return buffers[m];
 const r=await fetch(samples[m].url,{cache:"no-store"});
 if(!r.ok) throw new Error("Sample tidak ditemukan: "+samples[m].url);
 const b=await r.arrayBuffer();
 buffers[m]=await ctx.decodeAudioData(b);
 return buffers[m];
}

function playLoop(buffer, rate, gainValue){
 const src=ctx.createBufferSource(); src.buffer=buffer; src.loop=true; src.playbackRate.value=rate;
 const g=ctx.createGain(); g.gain.value=gainValue;
 src.connect(g); g.connect(master); src.start();
 return {src,g};
}

let layers=[];

function stopLayers(){
 for(const x of layers){try{x.src.stop()}catch(e){}}
 layers=[];
}

async function startEngine(){
 await init();
 stopLayers();
 const b=await loadSample(mode);
 const s=samples[mode];
 const rate=s.min;
 const main=playLoop(b,rate,0.52);
 layers=[main];
 // Harmonic/texture layer: same sample at a higher rate and lower gain.
 const tex=playLoop(b,Math.min(s.max,rate*1.75),0.10);
 layers.push(tex);
 running=true; startTime=performance.now();
 document.getElementById("start").textContent="■ STOP ENGINE";
 document.getElementById("start").classList.add("stop");
 statusEl.innerHTML='<span class="badge">ENGINE RUNNING</span> • '+mode.toUpperCase()+' • '+ctx.state;
 update();
}

function stopEngine(){
 stopLayers(); running=false;
 document.getElementById("start").textContent="▶ START ENGINE";
 document.getElementById("start").classList.remove("stop");
 statusEl.textContent="Engine stopped.";
}

function update(){
 const t=Number(gas.value)/100;
 pct.textContent=Math.round(t*100)+"%";
 let target;
 if(mode==="electric") target=300+t*14700;
 else target=samples[mode].base+t*(samples[mode].red-samples[mode].base);
 const shown=Number(rpmEl.textContent)||samples[mode].base||300;
 const rpm=shown+(target-shown)*0.12;
 rpmEl.textContent=Math.round(rpm);

 if(running && layers.length){
   const s=samples[mode];
   const norm=mode==="electric"?t:(rpm-s.base)/(s.red-s.base);
   const n=Math.max(0,Math.min(1,norm));
   const rate=s.min+(s.max-s.min)*n;
   layers[0].src.playbackRate.setTargetAtTime(rate,ctx.currentTime,0.035);
   layers[0].g.gain.setTargetAtTime(0.25+0.48*t,ctx.currentTime,0.035);
   layers[1].src.playbackRate.setTargetAtTime(Math.min(s.max*1.45,rate*1.75),ctx.currentTime,0.035);
   layers[1].g.gain.setTargetAtTime(0.035+0.13*t,ctx.currentTime,0.035);
 }
 raf=requestAnimationFrame(update);
}

document.querySelectorAll(".mode").forEach(btn=>{
 btn.onclick=async()=>{
   document.querySelectorAll(".mode").forEach(x=>x.classList.remove("active"));
   btn.classList.add("active"); mode=btn.dataset.mode;
   if(running) await startEngine();
 };
});

document.getElementById("start").onclick=async()=>{
 try{ if(running) stopEngine(); else await startEngine(); }
 catch(e){ statusEl.innerHTML='<span class="warn">Gagal memuat audio:</span> '+e.message; }
};

document.getElementById("test").onclick=async()=>{
 try{
   await init();
   const o=ctx.createOscillator(), g=ctx.createGain();
   o.frequency.value=440; g.gain.value=0.28; o.connect(g); g.connect(master);
   o.start(); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.8);
   o.stop(ctx.currentTime+0.82);
   statusEl.innerHTML='<span class="badge">TEST TONE</span> • Jika terdengar, output Bluetooth siap.';
 }catch(e){statusEl.textContent=e.message}
};
</script>
</body>
</html>
