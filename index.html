<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>OMO X Engine Sound V4</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}
main{max-width:520px;margin:auto;padding:22px}h1{font-size:34px;margin:0}.sub{color:#888;letter-spacing:2px;font-size:11px}
.rpm{text-align:center;margin:28px 0}.rpmn{font-size:64px;font-weight:800;font-variant-numeric:tabular-nums}
.card{background:#191919;border-radius:18px;padding:18px;margin:14px 0}.row{display:flex;justify-content:space-between}.muted{color:#999;font-size:12px}
input[type=range]{width:100%;accent-color:#ff8a00;margin:22px 0 10px}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
button{border:0;border-radius:12px;padding:14px;font-weight:800;color:#fff;background:#303030}.mode.active{background:#ff8a00}.start{width:100%;background:#19a65a;font-size:16px}.start.stop{background:#d93636}.test{width:100%;margin-top:9px;background:#275c9b}
.status{padding:12px;border-radius:12px;background:#111;color:#aaa;font-size:12px;margin-top:12px}.badge{color:#6ee7a0}
</style></head>
<body><main>
<h1>OMO X</h1><div class="sub">ENGINE SOUND V4 • IDLE LOOP</div>
<div class="rpm"><div class="rpmn" id="rpm">900</div><div class="muted">VIRTUAL RPM</div></div>
<div class="card"><div class="row"><b>THROTTLE</b><b id="pct">0%</b></div>
<input id="gas" type="range" min="0" max="100" value="0"><div class="row muted"><span>0</span><span>50</span><span>100</span></div></div>
<div class="card"><b>SOUND CHARACTER</b><div class="modes">
<button class="mode active" data-mode="inline4">INLINE-4</button><button class="mode" data-mode="vtwin">V-TWIN</button><button class="mode" data-mode="electric">E-SPORT</button></div></div>
<button class="start" id="start">▶ START ENGINE</button><button class="test" id="test">🔊 TEST SPEAKER</button>
<div class="status" id="status">Tekan START ENGINE. Idle sekarang memakai loop terpisah agar tidak terdengar seperti mesin dinyalakan berulang.</div>
</main>
<script>
let ctx=null,master=null,running=false,mode="inline4",layers=[],lastT=0,transitionTimer=null;
const gas=document.getElementById("gas"),rpmEl=document.getElementById("rpm"),pct=document.getElementById("pct"),statusEl=document.getElementById("status");
const cfg={
 inline4:{acc:"audio/inline4.wav",idle:"audio/inline4_idle.wav",base:900,red:12500,accMin:.60,accMax:1.85,idleRate:.75},
 vtwin:{acc:"audio/vtwin.ogg",idle:"audio/vtwin_idle.wav",base:750,red:7500,accMin:.65,accMax:1.65,idleRate:.78},
 electric:{acc:"audio/electric.wav",idle:"audio/electric_idle.wav",base:300,red:15000,accMin:.55,accMax:2.20,idleRate:.70}
};
const buffers={};
async function init(){if(ctx)return;ctx=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();master=ctx.createGain();master.gain.value=.85;master.connect(ctx.destination);statusEl.innerHTML='<span class="badge">Audio aktif</span> • '+ctx.state}
async function getBuf(url){if(buffers[url])return buffers[url];const r=await fetch(url,{cache:"no-store"});if(!r.ok)throw Error("Audio tidak ditemukan: "+url);buffers[url]=await ctx.decodeAudioData(await r.arrayBuffer());return buffers[url]}
function make(buf,loop,rate,gain){const s=ctx.createBufferSource();s.buffer=buf;s.loop=loop;s.playbackRate.value=rate;const g=ctx.createGain();g.gain.value=gain;s.connect(g);g.connect(master);s.start();return{s,g}}
function fadeStop(obj,d=.12){if(!obj)return;const now=ctx.currentTime;obj.g.gain.cancelScheduledValues(now);obj.g.gain.setTargetAtTime(.0001,now,d/3);try{obj.s.stop(now+d)}catch(e){}}
function stopAll(){layers.forEach(x=>fadeStop(x,.08));layers=[]}
async function start(){
 await init();stopAll();const c=cfg[mode];
 const idle=await getBuf(c.idle), acc=await getBuf(c.acc);
 // Dedicated idle loop starts immediately; it is never the full start/rev recording.
 const i=make(idle,true,c.idleRate,.48);
 // Acceleration layer is looped only while throttle is above the idle zone, then faded.
 const a=make(acc,true,c.accMin,.001);
 layers=[i,a];running=true;document.getElementById("start").textContent="■ STOP ENGINE";document.getElementById("start").classList.add("stop");
 statusEl.innerHTML='<span class="badge">ENGINE RUNNING</span> • '+mode.toUpperCase()+' • idle loop aktif';requestAnimationFrame(update)
}
function stop(){stopAll();running=false;document.getElementById("start").textContent="▶ START ENGINE";document.getElementById("start").classList.remove("stop");statusEl.textContent="Engine stopped."}
function update(){
 const t=+gas.value/100;pct.textContent=Math.round(t*100)+"%";
 const c=cfg[mode], target=c.base+t*(c.red-c.base), shown=+rpmEl.textContent||c.base,r=shown+(target-shown)*.14;rpmEl.textContent=Math.round(r);
 if(running&&layers.length>=2){
   const idle=layers[0],acc=layers[1],n=Math.max(0,Math.min(1,(r-c.base)/(c.red-c.base)));
   // Keep idle audible at low throttle, then fade it out progressively.
   idle.s.playbackRate.setTargetAtTime(c.idleRate+.05*n,ctx.currentTime,.05);
   idle.g.gain.setTargetAtTime(.50*(1-Math.min(1,t/.22))+.04,ctx.currentTime,.06);
   // Acceleration sample becomes audible only after the idle zone.
   const ar=c.accMin+(c.accMax-c.accMin)*n;
   acc.s.playbackRate.setTargetAtTime(ar,ctx.currentTime,.045);
   const ag=Math.max(0,Math.min(1,(t-.08)/.25));
   acc.g.gain.setTargetAtTime(.02+.42*ag,ctx.currentTime,.07);
 }
 requestAnimationFrame(update)
}
document.querySelectorAll(".mode").forEach(b=>b.onclick=async()=>{document.querySelectorAll(".mode").forEach(x=>x.classList.remove("active"));b.classList.add("active");mode=b.dataset.mode;if(running){stop();await start()}});
document.getElementById("start").onclick=async()=>{try{running?stop():await start()}catch(e){statusEl.textContent=e.message}};
document.getElementById("test").onclick=async()=>{await init();const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=440;g.gain.value=.28;o.connect(g);g.connect(master);o.start();g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.8);o.stop(ctx.currentTime+.82);statusEl.innerHTML='<span class="badge">TEST TONE</span> • Jika terdengar, output audio siap.'};
</script></body></html>
